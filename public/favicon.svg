<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background canvas -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <!-- Main glowing brand tile -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#bgGrad)" filter="url(#subtleGlow)" />
  <rect x="56" y="56" width="400" height="400" rx="96" stroke="rgba(255,255,255,0.28)" stroke-width="6" />
  <!-- Envelope glyph -->
  <rect x="116" y="156" width="280" height="200" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="22" />
  <path d="M116 190L256 290L396 190" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="290" r="24" fill="#38bdf8" />
</svg>
